name: Security

# Vulnerability, secret, and dependency scanning. Complements CodeQL (SAST) and Dependabot
# (dependency update PRs) with fail-on-detection gates and a weekly scheduled sweep.
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-deps:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install ./backend
          pip install pip-audit
      - name: Audit installed dependencies for known vulnerabilities
        run: pip-audit --desc

  frontend-deps:
    name: Frontend dependency audit (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      # Gate on vulnerabilities in shipped (production) dependencies. Dev-only tooling
      # advisories remain visible via Dependabot and Trivy without blocking the pipeline.
      - name: Audit production dependencies (fail on high+)
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan → SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
